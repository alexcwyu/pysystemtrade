[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysystemtrade"
version = "1.8.2"
authors = [
  { name="Robert Carver", email="rob@systematicmoney.org" },
]
description = "Systematic futures trading in Python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = "==3.13.*"
keywords = ["systematic trading", "interactive brokers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "PyYAML>=6.0.3",
    "numpy>=2.3.4",
    "scipy>=1.16.3",
    "pymongo>=4.15.4",
    "ib-insync>=0.9.86",
    "psutil>=7.1.3",
    "Flask>=3.1.2",
    "Werkzeug>=3.1.3",
    "statsmodels>=0.14.5",
    "PyPDF2>=3.0.1",
    "scikit-learn>=1.7.2",
    "pytz>=2025.2",
    "pyarrow>=16",  # Relaxed from >=22.0.0 to allow compatibility with streamlit
]

[project.optional-dependencies]
arctic = ["arctic @ git+https://github.com/man-group/arctic.git"]
dev = ["pytest>=9.0.1", "black>=25.11.0"]

[project.urls]
"Homepage" = "https://github.com/robcarver17/pysystemtrade"
"Bug Tracker" = "https://github.com/robcarver17/pysystemtrade/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "sysbrokers",
    "syscontrol",
    "syscore",
    "sysdata",
    "sysexecution",
    "sysinit",
    "syslogdiag",
    "syslogging",
    "sysobjects",
    "sysproduction",
    "sysquant",
    "systems",
    "data",
]

[tool.hatch.build.targets.wheel.shared-data]
"data" = "share/pysystemtrade/data"

[tool.hatch.build.targets.sdist]
include = [
    "sysbrokers/**",
    "syscontrol/**",
    "syscore/**",
    "sysdata/**",
    "sysexecution/**",
    "sysinit/**",
    "syslogdiag/**",
    "syslogging/**",
    "sysobjects/**",
    "sysproduction/**",
    "sysquant/**",
    "systems/**",
    "data/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "tests/**",
    "examples/**",
    "docs/**",
    "dashboard/**",
    "private/**",
]

[tool.pytest.ini_options]
norecursedirs = "examples"
addopts = "--doctest-modules --ignore=systems/provided/moretradingrules/temp.py"
log_cli = "true"
log_cli_level = 10
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
doctest_optionflags = ["ELLIPSIS", "NUMBER", "NORMALIZE_WHITESPACE"]
testpaths = [
    # "syscore",
    # "syscore/interactive/display",
    "syscore/pandas",
    "syscore/tests",
    # "sysdata",
    "sysdata/config",
    # "sysdata/sim",
    "sysdata/tests",
    "sysinit/futures/tests",
    # "syslogdiag",
    "systems/tests",
    "sysobjects/production",
    "sysobjects/tests",
    # "sysquant/estimators",
    "sysquant/optimisation",
    # "systems",
    # "systems/accounts",
    # "systems/provided",
    # "systems/provided/futures_chapter15",
    "tests",
]

[tool.black]
line-length = 88
target-version = ["py313"]
required-version = "25.11.0"
