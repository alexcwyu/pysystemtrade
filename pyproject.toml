[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysystemtrade"
version = "1.8.2"
authors = [
  { name="Robert Carver", email="rob@systematicmoney.org" },
]
description = "Systematic futures trading in Python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = "==3.13.*"
keywords = ["systematic trading", "interactive brokers"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "PyYAML>=6.0.3",
    "numpy>=2.3.4",
    "scipy>=1.16.3",
    "pymongo>=4.15.4",
    "ib-insync>=0.9.86",
    "psutil>=7.1.3",
    "Flask>=3.1.2",
    "Werkzeug>=3.1.3",
    "statsmodels>=0.14.5",
    "PyPDF2>=3.0.1",
    "scikit-learn>=1.7.2",
    "pytz>=2025.2",
    "pyarrow>=16",  # Relaxed from >=22.0.0 to allow compatibility with streamlit
]

[project.optional-dependencies]
# arctic extra removed: arctic requires pymongo<4, incompatible with pymongo>=4.15.4
# arctic = ["arctic @ git+https://github.com/man-group/arctic.git"]

[dependency-groups]
dev = ["pytest>=9.0.1", "ruff>=0.9.0", "pyright>=1.1.390"]

[project.urls]
"Homepage" = "https://github.com/robcarver17/pysystemtrade"
"Bug Tracker" = "https://github.com/robcarver17/pysystemtrade/issues"

[tool.uv]
default-groups = ["dev"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/sysbrokers",
    "src/syscontrol",
    "src/syscore",
    "src/sysdata",
    "src/sysexecution",
    "src/sysinit",
    "src/syslogdiag",
    "src/syslogging",
    "src/sysobjects",
    "src/sysproduction",
    "src/sysquant",
    "src/systems",
    "src/data",
]

[tool.hatch.build.targets.wheel.shared-data]
"src/data" = "share/pysystemtrade/data"

[tool.hatch.build.targets.sdist]
include = [
    "src/sysbrokers/**",
    "src/syscontrol/**",
    "src/syscore/**",
    "src/sysdata/**",
    "src/sysexecution/**",
    "src/sysinit/**",
    "src/syslogdiag/**",
    "src/syslogging/**",
    "src/sysobjects/**",
    "src/sysproduction/**",
    "src/sysquant/**",
    "src/systems/**",
    "src/data/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "tests/**",
    "examples/**",
    "docs/**",
    "dashboard/**",
    "private/**",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib", "--doctest-modules", "--ignore=src/systems/provided/moretradingrules/temp.py"]
testpaths = [
    # "src/syscore",
    # "src/syscore/interactive/display",
    "src/syscore/pandas",
    "src/syscore/tests",
    # "src/sysdata",
    "src/sysdata/config",
    # "src/sysdata/sim",
    "src/sysdata/tests",
    "src/sysinit/futures/tests",
    # "src/syslogdiag",
    "src/systems/tests",
    "src/sysobjects/production",
    "src/sysobjects/tests",
    # "src/sysquant/estimators",
    "src/sysquant/optimisation",
    # "src/systems",
    # "src/systems/accounts",
    # "src/systems/provided",
    # "src/systems/provided/futures_chapter15",
    "tests",
]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]
norecursedirs = "examples"
log_cli = "true"
log_cli_level = 10
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
doctest_optionflags = ["ELLIPSIS", "NUMBER", "NORMALIZE_WHITESPACE"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sysbrokers", "syscontrol", "syscore", "sysdata", "sysexecution", "sysinit", "syslogdiag", "syslogging", "sysobjects", "sysproduction", "sysquant", "systems"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
